<g font-family="Arial, Helvetica, sans-serif"><text x="52" y="60" fill="#a2b9ce" font-size="15" letter-spacing="3">GÜRAY GÜR</text><text x="1148" y="60" text-anchor="end" fill="#7d9ab5" font-size="12" letter-spacing="2">SOFTWARE × AI AUTOMATION</text>
<text x="49" y="158" fill="#f1f7ff" font-size="58" font-weight="700" letter-spacing="-2">I build AI automations</text><text x="49" y="234" fill="#72ebce" font-size="58" font-weight="700" letter-spacing="-2">for real creative work.</text>
