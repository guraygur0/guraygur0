<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460">
<style>@keyframes orbit{from{transform:translate(960px,205px) rotate(-28deg)}to{transform:translate(960px,205px) rotate(332deg)}}@keyframes breathe{50%{opacity:.45}}@keyframes dash{to{stroke-dashoffset:-140}}@keyframes live{50%{opacity:.25}}.orbit{animation:orbit 32s linear infinite}.halo{animation:breathe 7s ease-in-out infinite}.ring{animation:dash 18s linear infinite}.live{animation:live 2.4s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.orbit,.halo,.ring,.live{animation:none}}</style><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08111f"/><stop offset="1" stop-color="#122e49"/></linearGradient><radialGradient id="halo"><stop stop-color="#46cdb5" stop-opacity=".25"/><stop offset="1" stop-color="#102439" stop-opacity="0"/></radialGradient><linearGradient id="orb" x2="1" y2="1"><stop stop-color="#c4fff0"/><stop offset=".35" stop-color="#5de2c9"/><stop offset=".7" stop-color="#3384bb"/><stop offset="1" stop-color="#0b2542"/></linearGradient></defs>
<rect width="1200" height="460" rx="24" fill="url(#bg)"/><circle class="halo" cx="960" cy="210" r="260" fill="url(#halo)"/>
