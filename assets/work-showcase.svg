<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350"><style>@keyframes flow{0%{transform:translateX(-35px);opacity:0}15%,85%{opacity:1}100%{transform:translateX(35px);opacity:0}}@keyframes scan{0%,100%{transform:translateX(-280px)}50%{transform:translateX(150px)}}@keyframes pulse{50%{fill:#347866;stroke:#a5ffe0}}.flow{animation:flow 3s ease-in-out infinite}.second{animation-delay:1.5s}.playhead{animation:scan 9s ease-in-out infinite}.core{animation:pulse 3s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.flow,.playhead,.core{animation:none}}</style><defs><linearGradient id="a" x2="1" y2="1"><stop stop-color="#102938"/><stop offset="1" stop-color="#0b1725"/></linearGradient><linearGradient id="b" x2="1" y2="1"><stop stop-color="#192841"/><stop offset="1" stop-color="#101829"/></linearGradient></defs><rect x="1" y="1" width="585" height="348" rx="20" fill="url(#a)" stroke="#254451"/><rect x="614" y="1" width="585" height="348" rx="20" fill="url(#b)" stroke="#2c3c56"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="42" fill="#72ebce" font-size="12" letter-spacing="2">01 / SOFTWARE &amp; AUTOMATION</text><text x="646" y="42" fill="#a4baff" font-size="12" letter-spacing="2">02 / CREATIVE OPERATIONS</text><g fill="none" stroke="#4fae9e" stroke-width="2"><path d="M111 140H250M330 140h125M290 170v35H180"/><rect x="55" y="104" width="100" height="72" rx="12" fill="#162f3c"/><rect class="core" x="242" y="96" width="96" height="88" rx="18" fill="#21463f"/><rect x="420" y="104" width="112" height="72" rx="12" fill="#162f3c"/></g><g fill="#b7e9de" font-size="17" text-anchor="middle"><text x="105" y="147">INPUT</text><text x="290" y="148" font-size="27" font-weight="700">AI</text><text x="476" y="147">ACTION</text></g><circle class="flow" cx="196" cy="140" r="5" fill="#72ebce"/><circle class="flow second" cx="379" cy="140" r="5" fill="#72ebce"/><text x="55" y="249" fill="#eff7ff" font-size="28" font-weight="700">AI-assisted task assignment</text><text x="55" y="282" fill="#91aebf" font-size="17">Custom software connecting analysis and tasks.</text><text x="55" y="317" fill="#72ebce" font-size="12" letter-spacing="1">CUSTOM TEAM MANAGEMENT PANEL</text><rect x="654" y="77" width="505" height="129" rx="12" fill="#0b1423" stroke="#2a3d59"/><circle cx="674" cy="94" r="3" fill="#a4baff"/><circle cx="686" cy="94" r="3" fill="#546b8a"/><circle cx="698" cy="94" r="3" fill="#546b8a"/><g fill="#345578"><rect x="675" y="113" width="84" height="24" rx="4"/><rect x="765" y="113" width="150" height="24" rx="4"/><rect x="921" y="113" width="104" height="24" rx="4"/></g><g fill="#586999"><rect x="715" y="143" width="140" height="18" rx="4"/><rect x="861" y="143" width="190" height="18" rx="4"/></g><path d="M675 183l12-6 10 11 10-16 10 20 10-16 10 12 10-9 10 4h330" fill="none" stroke="#76d9bd" stroke-width="2"/><path class="playhead" d="M968 107v91" stroke="#c9d5ff" stroke-width="2"/><text x="646" y="249" fill="#eff7ff" font-size="28" font-weight="700">Multi-channel production</text><text x="646" y="282" fill="#96aac4" font-size="17">Creative direction, editing, and team coordination.</text><text x="646" y="317" fill="#a4baff" font-size="12" letter-spacing="1">WORKFLOWS ACROSS 4+ GLOBAL CHANNELS</text></g></svg>
